</main>
<div class="transition" id="transition" aria-hidden="true"><small>THE HARVEST VOYAGE</small><span>第二章・海上的不速之客</span></div>
<dialog id="confirm"><p>要重新啟航嗎？<br>這次的故事將從首頁開始。</p><button class="primary" id="confirmYes">重新開始</button><button class="choice" id="confirmNo" style="margin-top:10px;width:100%;justify-content:center">繼續旅程</button></dialog>
<noscript>請開啟瀏覽器的 JavaScript，即可開始冒險。</noscript>
<script>
'use strict';
const $=id=>document.getElementById(id);
const icons={
treatment:'<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M16 34 12 22Q2 17 8 8l9 8 6-11q12 15 1 22l5 12" fill="#f1eee1" stroke="currentColor" stroke-width="2.5"/><path d="m11 17 14 1m-12 5 10 1m-7 7 9-3" stroke="currentColor" stroke-width="2"/><path d="m31 13 11 2m-5-7-1 12" stroke="#c1a367" stroke-width="2.5"/></svg>',
living:'<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 19h32v24H8Z" fill="#edf4f3" stroke="currentColor" stroke-width="2"/><path d="M5 19 10 7h28l5 12Z" fill="#d9bf82" stroke="currentColor" stroke-width="2"/><path d="M13 24h22v13H13Z" fill="#fffaf0" stroke="currentColor"/><path d="M17 29h14m-12 4h10" stroke="currentColor" stroke-width="2"/><path d="M16 43v-4h16v4" stroke="currentColor" stroke-width="2"/></svg>',
care:'<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="16" cy="11" r="5" fill="#d2af67"/><circle cx="33" cy="14" r="5" fill="#8ab2b5"/><path d="m12 21 7-1 8 9m-11-7-4 12m6-5 6 14m-11-9-4 9m22-19-5 7m6-9 4 11 4 10m-5-10-6 10" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const needs=[{title:'治療支出',short:'治療',icon:'treatment',body:'治療鉗子，要花錢。',quote:'鉗子要修好，這筆少不了。'},{title:'工作中斷',short:'生活',icon:'living',body:'暫時不能工作，生活還是要過。',quote:'我的開鎖生意，也得暫停了……'},{title:'照顧需求',short:'照顧',icon:'care',body:'恢復期間，需要有人幫忙。',quote:'現在連吃飯，都得找人幫忙。'}];
const clues=[{title:'治療支出',icon:'treatment',question:'治療和恢復，大概要花多少錢？'},{title:'生活準備',icon:'living',question:'不能工作時，手邊的儲蓄，可以支撐生活開銷多久？'},{title:'照顧安排',icon:'care',question:'恢復期間，有誰能幫忙照顧？'}];
const story={
home:{who:'尋找豐收寶藏',text:'口袋滿滿之後，\n下一份寶藏，會是什麼？',note:'準備好，和羊咩咩一起繼續航行。',buttons:[['開始冒險','sail']],step:0},
sail:{who:'航海誌',text:'告別口袋滿滿島，羊咩咩帶著豐收的喜悅，航向下一座島嶼。',buttons:[['繼續航行','fog']],mode:'departing',step:1},
fog:{who:'航海誌',text:'海上，忽然升起一陣濃霧。',note:'一艘黑色小船緩緩出現，擋住去路。船上站著一位斗篷神秘客……',buttons:[['看看是誰','stranger']],mode:'mist encounter',step:1},
stranger:{who:'斗篷神秘客',text:'你可曾在海上，\n救過一隻狐狸？',note:'選擇羊咩咩的回答',choices:[['難道你就是那隻狐狸？','first1'],['你是來要寶箱的嗎？可是寶箱已經開了','first2'],['我沒有藏寶圖！！','first3']],mode:'encounter',step:2},
first1:{who:'斗篷神秘客',text:'不是！\n你再仔細想想！',buttons:[['神秘客究竟是誰？','reveal']],mode:'encounter',step:2},
first2:{who:'斗篷神秘客',text:'很接近了！\n跟寶箱有關！',buttons:[['神秘客究竟是誰？','reveal']],mode:'encounter',step:2},
first3:{who:'斗篷神秘客',text:'此地無銀三百兩！',buttons:[['神秘客究竟是誰？','reveal']],mode:'encounter',step:2},
reveal:{who:'螃蟹',text:'我是那隻開鎖的螃蟹！！',note:'牠緩慢掀開斗篷，舉起包滿繃帶的鉗子。',buttons:[['這個場面，怎麼接？','second']],mode:'encounter revealed',step:3},
second:{who:'羊咩咩',text:'我該怎麼回答……？',choices:[['壯士等等！請聽我狡辯！','second1'],['我有什麼可以幫你的嗎？','second2'],['我先走一步（轉身逃跑）','run']],mode:'encounter revealed',step:3},
second1:{who:'螃蟹',text:'先聽我說完！',buttons:[['聽螃蟹說','bill']],mode:'encounter revealed',step:3},
second2:{who:'螃蟹',text:'這個問題，\n我等很久了。',buttons:[['聽螃蟹說','bill']],mode:'encounter revealed',step:3},
run:{who:'羊咩咩',text:'我先走一步！',note:'螃蟹「唰」地橫移，再次擋在前面。',buttons:[['……被攔下了','blocked']],mode:'encounter revealed escape block',step:3},
blocked:{who:'螃蟹',text:'你是不是忘了……\n我橫著走的…… = =',buttons:[['羊咩咩：失算了！','bill']],mode:'encounter revealed escape block',step:3},
bill:{who:'螃蟹',text:'你開的是寶箱，\n我開的是帳單！',note:'螃蟹拿出一張長長的醫療帳單。',buttons:[['看看這張帳單','billQuestion']],mode:'encounter revealed billing',step:4},
billQuestion:{who:'羊咩咩',text:'這……都是修鉗子的費用？',buttons:[['聽聽螃蟹怎麼說','billAnswer']],mode:'encounter revealed billing',step:4},
billAnswer:{who:'螃蟹',text:'你以為，只有修鉗子嗎？',buttons:[['還有哪些事？','cards']],mode:'encounter revealed billing',step:4},
cards:{who:'受傷之後的三件事',text:'點開卡片，看看螃蟹\n還遇到了什麼。',cards:true,buttons:[['一起看看藏寶圖','afterCards']],mode:'encounter revealed cards-scene',step:4},
afterCards:{who:'螃蟹',text:'鉗子可以休息，\n生活可不會。',summary:true,buttons:[['一起想想辦法','map']],mode:'encounter revealed',step:4},
map:{who:'羊咩咩',text:'等等，卷軸上還有其他島！',note:'一起去找寶藏（保障）的線索！',buttons:[['尋找保障線索','clueChoice']],mode:'mapping',step:5},
clueChoice:{who:'換你當領航員',text:'幫螃蟹找寶藏（保障）線索，\n你會先問哪件事？',note:'每一個提問，都是了解需求的起點。',choices:clues.map((c,i)=>[c.title+'｜'+c.question,'collect'+i]),mode:'mapping',step:5},
collect0:{who:'取得保障線索',text:'已取得一條保障線索。',note:'治療支出｜治療和恢復，大概要花多少錢？',buttons:[['帶著線索出發','island']],mode:'collecting',step:5,clue:0},
collect1:{who:'取得保障線索',text:'已取得一條保障線索。',note:'生活準備｜不能工作時，手邊的儲蓄，可以支撐生活開銷多久？',buttons:[['帶著線索出發','island']],mode:'collecting',step:5,clue:1},
collect2:{who:'取得保障線索',text:'已取得一條保障線索。',note:'照顧安排｜恢復期間，有誰能幫忙照顧？',buttons:[['帶著線索出發','island']],mode:'collecting',step:5,clue:2},
island:{who:'下一站',text:'價值滿滿',note:'線索全都指向第二座島。\n羊咩咩與螃蟹一起，尋找守護生活的寶藏。',buttons:[['前往島嶼','end']],mode:'arrival',step:6},
end:{who:'旅程，未完待續',text:'待續…',note:'請將目光回到現場，一起探索「價值滿滿」。',buttons:[['重新體驗','home']],mode:'arrival end-scene',step:6}
};
let current='home',busy=false,enabled=false,audio=null,selectedClue=null,opened=new Set(),cardTimer=null;
function chime(){if(!enabled)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(587,audio.currentTime);o.frequency.exponentialRampToValueAtTime(880,audio.currentTime+.16);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.26)}catch(e){enabled=false;$('sound').setAttribute('aria-pressed','false')}}
function buildCards(){
$('cardGrid').replaceChildren();$('cardGrid').classList.remove('complete');
needs.forEach((n,i)=>{const b=document.createElement('button');b.className='need-card';b.setAttribute('aria-label','翻開'+n.title);b.setAttribute('aria-pressed','false');b.innerHTML='<span class="card-inner"><span class="card-face front">'+icons[n.icon]+'<span>點擊探索</span></span><span class="card-face back">'+icons[n.icon]+'<strong>'+n.title+'</strong><small>'+n.body+'</small></span></span>';b.addEventListener('click',()=>{
if(opened.has(i)){if(opened.size<3)$('cardQuote').textContent='螃蟹：「'+n.quote+'」';return;}
opened.add(i);chime();b.classList.add('flipped');b.setAttribute('aria-pressed','true');b.setAttribute('aria-label',n.title+'：'+n.body+' 螃蟹說：'+n.quote);$('cardQuote').textContent='螃蟹：「'+n.quote+'」';$('note').textContent='已探索 '+opened.size+' / 3 張卡片';
if(opened.size===3){cardTimer=setTimeout(()=>{if(current!=='cards')return;$('cardGrid').classList.add('complete');$('cardGrid').querySelectorAll('.back strong').forEach((e,j)=>e.textContent=needs[j].short);$('actions').querySelector('button').disabled=false;$('actions').querySelector('span').textContent='三條線索，都看見了';$('note').textContent='治療、生活、照顧，都是需要準備的事。'},1800);}
});$('cardGrid').append(b);});
$('cardQuote').textContent='三張卡片，藏著三個生活中的需要。';
}
function render(key,focus=true){
clearTimeout(cardTimer);const s=story[key];current=key;
if(key==='home'){selectedClue=null;opened.clear();}
if(s.clue!==undefined)selectedClue=s.clue;
$('title').classList.toggle('hidden',key!=='home');$('scene').className='scene '+(s.mode||'');
$('chapter').textContent=key==='home'?'THE HARVEST VOYAGE':key==='island'||key==='end'?'NEXT DESTINATION · 價值滿滿':'CHAPTER 02 · 海上的不速之客';
$('speaker').textContent=s.who;$('dialog').textContent=s.text;$('note').textContent=s.note||'';$('note').classList.toggle('hidden',!s.note&&!s.cards);
$('cardsArea').classList.toggle('hidden',!s.cards);$('summary').classList.toggle('hidden',!s.summary);
if(s.cards){opened.clear();buildCards();$('note').textContent='可自由選擇順序，翻開全部卡片後繼續。';}
const showBadge=selectedClue!==null&&['island','end'].includes(key);$('clueBadge').classList.toggle('hidden',!showBadge);
if(showBadge){const c=clues[selectedClue];$('clueBadge').innerHTML=icons[c.icon]+'<span>已攜帶線索：<strong>'+c.title+'</strong><br>'+c.question+'</span>';}
$('collectIcon').innerHTML=selectedClue===null?'':icons[clues[selectedClue].icon];
$('actions').replaceChildren();(s.choices||s.buttons).forEach(([label,target],i)=>{const b=document.createElement('button');b.className=s.choices?'choice':'primary';if(s.choices){const n=document.createElement('b');n.textContent='0'+(i+1);b.append(n);}const text=document.createElement('span');text.textContent=label;text.style.whiteSpace='pre-line';b.append(text);if(s.cards){b.disabled=true;text.textContent='請先翻開三張卡片';}b.addEventListener('click',()=>go(target));$('actions').append(b);});
$('progress').replaceChildren();for(let i=1;i<=6;i++){const dot=document.createElement('i');dot.className=i<=s.step?'on':'';$('progress').append(dot);}$('progress').setAttribute('aria-label',`故事進度 ${s.step} / 6`);
$('foot').textContent=key==='home'?'一段關於豐收與守護的旅程':key==='end'?'TO BE CONTINUED':'尋找豐收寶藏 ／ 第二章';
$('scene').setAttribute('aria-label',s.mode?.includes('arrival')?'羊咩咩與螃蟹同乘帆船，航向價值滿滿島':s.mode?.includes('mapping')||s.mode?.includes('collecting')?'藏寶圖上三座島嶼與通往價值滿滿島的線索':s.mode?.includes('revealed')?'羊咩咩與舉著繃帶蟹鉗的螃蟹在海上相遇':'羊咩咩乘著帆船的海上旅程');
if(focus)$('dialog').focus({preventScroll:true});
}
function go(key){
if(busy)return;if(current==='cards'&&key==='afterCards'&&opened.size!==3)return;
busy=true;chime();$('panel').classList.add('changing');$('actions').querySelectorAll('button').forEach(b=>b.disabled=true);
const chapter=(current==='home'&&key==='sail')||key==='island';if(chapter){$('transition').querySelector('span').textContent=key==='island'?'下一站・價值滿滿':'第二章・海上的不速之客';$('transition').classList.remove('play');void $('transition').offsetWidth;$('transition').classList.add('play');}
setTimeout(()=>{render(key);$('panel').classList.remove('changing');busy=false;},chapter?560:230);
}
$('sound').addEventListener('click',()=>{enabled=!enabled;$('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'關閉音效':'開啟音效');$('sound').style.background=enabled?'#e9d6a4':'#ffffff65';chime();});
$('restart').addEventListener('click',()=>$('confirm').showModal());$('confirmNo').addEventListener('click',()=>$('confirm').close());$('confirmYes').addEventListener('click',()=>{$('confirm').close();go('home');});render('home',false);
</script>
</body></html>
